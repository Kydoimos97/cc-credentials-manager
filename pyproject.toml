[project]
name = "cc-credentials-manager"
version = "0.1.0"
description = "Credentials Manager for Claude Code — multi-token OAuth rotation and autonomous runner"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.0.1",
    "textual>=0.80.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "tzdata>=2024.1",
    "logspark[color]>=0.10.2",
    "httpx>=0.27.1",
    "filelock>=3.12.0",
]

[project.urls]
Repository = "https://github.com/Kydoimos97/cc-credentials-manager"

[project.scripts]
claude-auto = "cc_cred.cli_auto:main"
cc-creds    = "cc_cred.cli_creds:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cc_cred"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
