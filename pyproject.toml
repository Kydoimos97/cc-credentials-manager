[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-credentials-manager"
version = "0.1.5"
description = "Credentials Manager for Claude Code — multi-token OAuth rotation and autonomous runner"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "claude-agent-sdk>=0.0.1",
  "textual>=0.80.0",
  "click>=8.0.0",
  "rich>=13.0.0",
  "tzdata>=2024.1",
  "logspark[color]>=1.1.0",
  "httpx>=0.27.1",
  "filelock>=3.12.0",
]

  [project.license]
  text = "MIT"

  [[project.authors]]
  name = "Willem van der Schans"

  [project.urls]
  Homepage = "https://github.com/Kydoimos97/cc-credentials-manager"
  Repository = "https://github.com/Kydoimos97/cc-credentials-manager"
  PyPI = "https://pypi.org/project/cc-credentials-manager/"
  "Author GitHub" = "https://github.com/Kydoimos97"

  [project.scripts]
  claude-auto = "cc_cred.cli_auto:main"
  cc-creds    = "cc_cred.cli_creds:main"

[tool.hatch.build.targets.sdist]
include = [
  "cc_cred",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["cc_cred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--disable-warnings"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["cc_cred"]
omit = ["*/__init__.py"]
relative_files = true

[tool.coverage.report]
precision = 0
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[dependency-groups]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]
